name: Build and Release Android APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      MINIO_ACCESS: ${{ secrets.MINIO_ACCESS }}
      MINIO_SECRET: ${{ secrets.MINIO_SECRET }}
      MINIO_REGION: ${{ secrets.MINIO_REGION || 'us-east-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # ubuntu-latest 镜像已自带完整 Android SDK（$ANDROID_HOME 已就绪）。
      # android-actions/setup-android@v3 会强制再装已被 Google 下线的 'tools' 包，
      # 在 ubuntu-24.04 上必然失败（Failed to find package 'tools'），故移除。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head
          sdkmanager --version || true

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Patch react-native-track-player
        run: |
          FILE=$(find node_modules -name MusicModule.kt | grep "react-native-track-player")
          if [ -n "$FILE" ]; then
            echo "Patching $FILE"
            sed -i 's/metadata.putBundle(Metas.METADATA_KEY_EXTRAS, bundle)/metadata.putBundle(Metas.METADATA_KEY_EXTRAS, bundle ?: Bundle())/g' "$FILE"
            sed -i 's/intent.putExtras(bundle)/intent.putExtras(bundle ?: Bundle())/g' "$FILE"
          else
            echo "MusicModule.kt not found"
          fi

      - name: Build Dependencies
        run: |
          pnpm --filter @soundx/ws run build
          pnpm --filter @soundx/i18e run build
          pnpm --filter @soundx/utils run build
          pnpm --filter @soundx/db run generate

      # ========== 新增：手动复制网络安全配置文件 ==========
      - name: Copy Network Security Config
        run: |
          # 创建 xml 目录（如果不存在）
          mkdir -p apps/mobile/android/app/src/main/res/xml
          # 复制配置文件到 Android 原生工程目录
          cp apps/mobile/network_security_config.xml apps/mobile/android/app/src/main/res/xml/
          # 验证文件是否复制成功
          ls -la apps/mobile/android/app/src/main/res/xml/

      # 在 Copy Network Security Config 之后添加
      - name: Verify AndroidManifest Configuration
        run: |
          # 查看 AndroidManifest.xml 中是否包含 networkSecurityConfig 配置
          grep -n "networkSecurityConfig" apps/mobile/android/app/src/main/AndroidManifest.xml
          # 查看生成的配置文件内容
          cat apps/mobile/android/app/src/main/res/xml/network_security_config.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename and Prepare APK
        id: prepare_apk
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          OLD_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          NEW_NAME="AudioDock-${VERSION}.apk"
          NEW_PATH="apps/mobile/android/app/build/outputs/apk/release/${NEW_NAME}"
          mv "$OLD_PATH" "$NEW_PATH"
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to MinIO
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.MINIO_ENDPOINT != '' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ env.MINIO_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_SECRET }}
          AWS_DEFAULT_REGION: ${{ env.MINIO_REGION }}
        run: |
          set -e
          mkdir -p ~/.aws
          printf '[default]\ns3 =\n    addressing_style = path\n' > ~/.aws/config
          VERSION="${{ github.ref_name }}"
          APK="${{ steps.prepare_apk.outputs.apk_path }}"
          name="$(basename "$APK")"
          echo "Uploading $name -> minio:$MINIO_BUCKET/audiodock/releases/$VERSION/"
          aws s3 cp "$APK" "s3://$MINIO_BUCKET/audiodock/releases/$VERSION/$name" --endpoint-url "$MINIO_ENDPOINT" --no-progress
