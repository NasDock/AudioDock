name: Test Build (feat/test)

on:
  push:
    branches:
      - "feat/test"
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }}/${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            target: aarch64-apple-darwin
            command: build:mac:arm64
            bundle_subdir: aarch64-apple-darwin
          - os: macos-latest
            platform: mac
            arch: x64
            target: x86_64-apple-darwin
            command: build:mac:x64
            bundle_subdir: x86_64-apple-darwin
          - os: windows-latest
            platform: win
            arch: x64
            target: x86_64-pc-windows-msvc
            command: build:win
            bundle_subdir: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: win
            arch: arm64
            target: aarch64-pc-windows-msvc
            command: build:win:arm64
            bundle_subdir: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: ""
            command: build:linux
            bundle_subdir: ""
    runs-on: ${{ matrix.os }}
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      MINIO_ACCESS: ${{ secrets.MINIO_ACCESS }}
      MINIO_SECRET: ${{ secrets.MINIO_SECRET }}
      MINIO_REGION: ${{ secrets.MINIO_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target && format('{0}', matrix.target) || '' }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Build Dependencies
        run: |
          pnpm --filter @soundx/ws run build
          pnpm --filter @soundx/i18e run build
          pnpm --filter @soundx/utils run build
          pnpm --filter @soundx/db run generate
          pnpm --filter @soundx/services run build

      - name: Pre-download Tauri bundle tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        # tauri bundler 打 AppImage 时会从 github.com 下载 AppRun/linuxdeploy，
        # GitHub 偶发 504 导致整个 build 失败；先带重试预下载到 bundler 缓存目录，
        # bundler 检测到文件已存在即跳过下载。缓存文件名规则见 tauri-bundler
        # linuxdeploy.rs：AppRun-{arch} 与 linuxdeploy-07333c6-{arch}.AppImage。
        run: |
          set -e
          mkdir -p ~/.cache/tauri
          curl -fSL --connect-timeout 30 --retry 6 --retry-all-errors --retry-delay 10 \
            -o ~/.cache/tauri/AppRun-x86_64 \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          curl -fSL --connect-timeout 30 --retry 6 --retry-all-errors --retry-delay 10 \
            -o ~/.cache/tauri/linuxdeploy-07333c6-x86_64.AppImage \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
          chmod +x ~/.cache/tauri/AppRun-x86_64 ~/.cache/tauri/linuxdeploy-07333c6-x86_64.AppImage
          ls -la ~/.cache/tauri/

      - name: Build Tauri App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter sound-x run ${{ matrix.command }}

      - name: List build outputs
        if: matrix.os != 'windows-latest'
        run: |
          echo "Listing Tauri bundle outputs..."
          ls -la apps/desktop/src-tauri/target/*/release/bundle/ 2>/dev/null || true
          find apps/desktop/src-tauri/target -type d -name "bundle" -exec ls -la {} \;

      - name: Upload Release Assets (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test Build (feat/test)
          draft: true
          files: |
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers to MinIO
        # test 分支默认推 MinIO：去掉 if 条件后 secrets 缺失会直接 fail（明显报错），
        # 便于在仓库 Settings → Secrets 配置 MINIO_ENDPOINT / MINIO_BUCKET / MINIO_ACCESS / MINIO_SECRET / MINIO_REGION。
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ env.MINIO_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_SECRET }}
          AWS_DEFAULT_REGION: ${{ env.MINIO_REGION }}
        run: |
          set -e
          mkdir -p ~/.aws
          printf '[default]\ns3 =\n    addressing_style = path\n' > ~/.aws/config
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          SUBDIR="${{ matrix.bundle_subdir }}"
          BUNDLE_DIR="apps/desktop/src-tauri/target/${SUBDIR:+${SUBDIR}/}release/bundle"
          echo "Uploading ${{ matrix.platform }}/${{ matrix.arch }} installers -> minio:$MINIO_BUCKET/audiodock/releases/$VERSION/"
          found=0
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            echo "  -> $name"
            aws s3 cp "$f" "s3://$MINIO_BUCKET/audiodock/releases/$VERSION/$name" --endpoint-url "$MINIO_ENDPOINT" --no-progress
            found=1
          done < <(find "$BUNDLE_DIR" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          [ "$found" = "1" ] || echo "No installer files found in $BUNDLE_DIR"

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
      MINIO_ACCESS: ${{ secrets.MINIO_ACCESS }}
      MINIO_SECRET: ${{ secrets.MINIO_SECRET }}
      MINIO_REGION: ${{ secrets.MINIO_REGION || 'us-east-1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # ubuntu-latest 镜像已自带完整 Android SDK（$ANDROID_HOME 已就绪）。
      # android-actions/setup-android@v3 会强制再装已被 Google 下线的 'tools' 包，
      # 在 ubuntu-24.04 上必然失败（Failed to find package 'tools'），故移除。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head
          sdkmanager --version || true

      # RN 0.81 默认 ndkVersion=27.1.12297006。ubuntu-latest 镜像不一定预装该版本，
      # 缺了会由 gradle 自动下载安装（无校验无重试），zip 损坏即报
      # "Error on ZipFile unknown archive"（2026-11-03 踩坑），这里用 sdkmanager 预装并带重试。
      - name: Install NDK 27.1.12297006
        run: |
          set -e
          if [ -d "$ANDROID_HOME/ndk/27.1.12297006" ]; then
            echo "NDK 27.1.12297006 already installed"
            exit 0
          fi
          # sdkmanager 不在 PATH：ubuntu 镜像里位于 cmdline-tools/<版本>/bin/ 下
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -z "$SDKMANAGER" ] && SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          echo "Using SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for i in 1 2 3; do
            "$SDKMANAGER" "ndk;27.1.12297006" && break
            echo "NDK install attempt $i failed, cleaning up and retrying..."
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006" || true
            sleep 10
          done
          ls "$ANDROID_HOME/ndk/27.1.12297006" > /dev/null

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Patch react-native-track-player
        run: |
          FILE=$(find node_modules -name MusicModule.kt | grep "react-native-track-player")
          if [ -n "$FILE" ]; then
            echo "Patching $FILE"
            sed -i 's/metadata.putBundle(Metas.METADATA_KEY_EXTRAS, bundle)/metadata.putBundle(Metas.METADATA_KEY_EXTRAS, bundle ?: Bundle())/g' "$FILE"
            sed -i 's/intent.putExtras(bundle)/intent.putExtras(bundle ?: Bundle())/g' "$FILE"
          else
            echo "MusicModule.kt not found"
          fi

      - name: Build Dependencies
        run: |
          pnpm --filter @soundx/ws run build
          pnpm --filter @soundx/i18e run build
          pnpm --filter @soundx/utils run build
          pnpm --filter @soundx/db run generate

      - name: Copy Network Security Config
        run: |
          mkdir -p apps/mobile/android/app/src/main/res/xml
          cp apps/mobile/network_security_config.xml apps/mobile/android/app/src/main/res/xml/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          # kotlin-compiler-embeddable 等依赖经 Maven Central 重定向到 github.com 下载，
          # GitHub 偶发 504（tag 构建是冷缓存，必走全量下载），失败时重试最多 3 次。
          for i in 1 2 3; do
            ./gradlew assembleRelease && break
            echo "Gradle build attempt $i failed, retrying in 20s..."
            sleep 20
          done

      - name: Rename and Prepare APK
        id: prepare_apk
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          OLD_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          NEW_NAME="AudioDock-${VERSION}-test.apk"
          NEW_PATH="apps/mobile/android/app/build/outputs/apk/release/${NEW_NAME}"
          mv "$OLD_PATH" "$NEW_PATH"
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT

      - name: Upload Release Assets (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test Build (feat/test)
          draft: true
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to MinIO
        # test 分支默认推 MinIO：去掉 if 条件后 secrets 缺失会直接 fail（明显报错），
        # 便于在仓库 Settings → Secrets 配置 MINIO_ENDPOINT / MINIO_BUCKET / MINIO_ACCESS / MINIO_SECRET / MINIO_REGION。
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ env.MINIO_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.MINIO_SECRET }}
          AWS_DEFAULT_REGION: ${{ env.MINIO_REGION }}
        run: |
          set -e
          mkdir -p ~/.aws
          printf '[default]\ns3 =\n    addressing_style = path\n' > ~/.aws/config
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          APK="${{ steps.prepare_apk.outputs.apk_path }}"
          name="$(basename "$APK")"
          echo "Uploading $name -> minio:$MINIO_BUCKET/audiodock/releases/$VERSION/"
          aws s3 cp "$APK" "s3://$MINIO_BUCKET/audiodock/releases/$VERSION/$name" --endpoint-url "$MINIO_ENDPOINT" --no-progress