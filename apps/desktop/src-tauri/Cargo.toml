[package]
name = "sound-x"
version = "1.2.6"
description = "AudioDock - A modern audio player"
authors = ["mmdctjj <mmdctjj@gmail.com>"]
license = "MIT"
repository = "https://github.com/mmdctjj/AudioDock"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
dirs = "5"
percent-encoding = "2"
tauri-plugin-opener = "2"
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(windows)'.dependencies]
# 任务栏缩略图定制（ITaskbarList3 + DWM iconic thumbnail），见 src/taskbar_thumb.rs
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
